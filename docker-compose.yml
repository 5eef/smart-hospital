services:
  mysql:
    image: mysql:8.4
    container_name: smart-hospital-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_hospital
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: smart_user
      MYSQL_PASSWORD: smart_password
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    container_name: smart-hospital-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: Smart Hospital
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: smart_hospital
      DB_USERNAME: smart_user
      DB_PASSWORD: smart_password
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
      CORS_SUPPORTS_CREDENTIALS: "true"
      BROADCAST_CONNECTION: log
      MAIL_MAILER: log
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    command: >
      sh -c "composer install --no-interaction &&
             if [ -z "$$APP_KEY" ]; then php artisan key:generate --force && unset APP_KEY; fi &&
             php artisan config:clear &&
             php artisan migrate --seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-hospital-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8001/api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql-data:
  backend-vendor:
  frontend-node-modules:
